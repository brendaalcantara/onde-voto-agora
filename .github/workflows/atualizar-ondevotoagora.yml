name: Atualizar OndeVotoAgora com dados do TSE

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: atualizar-ondevotoagora-main
  cancel-in-progress: false

jobs:
  coletar:
    name: Consultar e validar o TSE
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      needs_update: ${{ steps.preflight.outputs.needs_update }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Instalar navegador e testar as validações locais
        run: |
          node --version
          npm ci --prefix ondevotoagora/automation
          npm test --prefix ondevotoagora/automation
          ondevotoagora/automation/node_modules/.bin/playwright install --with-deps chromium

      - name: Coletar a exportação nacional do TSE
        run: node ondevotoagora/relatorios/coletar-secoes-tse.mjs --output-dir="$RUNNER_TEMP/ondevotoagora-tse"

      - name: Conferir se a lista mudou
        id: preflight
        run: |
          node ondevotoagora/relatorios/publicar-atualizacao-tse.mjs \
            --capture-dir="$RUNNER_TEMP/ondevotoagora-tse" \
            --check-only

      - name: Preparar pasta do cache de resultados
        if: steps.preflight.outputs.needs_results_zip == 'true'
        run: mkdir -p "$RUNNER_TEMP/ondevotoagora-resultados"

      - name: Restaurar o ZIP oficial de resultados já validado
        if: steps.preflight.outputs.needs_results_zip == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/ondevotoagora-resultados
          key: tse-resultados-2026-2d42006d0f6c6e00bad83f5c23cd3d78cd3e3182dbc1ad6718222b6b132c23e1

      - name: Baixar e validar o ZIP oficial de resultados se necessário
        if: steps.preflight.outputs.needs_results_zip == 'true'
        env:
          RESULTS_ZIP: ${{ runner.temp }}/ondevotoagora-resultados/votacao_secao_2026_BR.zip
        run: |
          if [ -f "$RESULTS_ZIP" ]; then
            cached_size="$(stat -c '%s' "$RESULTS_ZIP")"
            cached_hash="$(sha256sum "$RESULTS_ZIP" | cut -d ' ' -f 1)"
            if [ "$cached_size" != "161616519" ] || [ "$cached_hash" != "2d42006d0f6c6e00bad83f5c23cd3d78cd3e3182dbc1ad6718222b6b132c23e1" ]; then
              rm -f "$RESULTS_ZIP"
            fi
          fi
          if [ ! -f "$RESULTS_ZIP" ]; then
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 600 \
              --output "$RESULTS_ZIP" \
              https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/votacao_secao_2026_BR.zip
          fi
          test "$(stat -c '%s' "$RESULTS_ZIP")" = "161616519"
          echo "2d42006d0f6c6e00bad83f5c23cd3d78cd3e3182dbc1ad6718222b6b132c23e1  $RESULTS_ZIP" | sha256sum --check --status

      - name: Preparar a nova versão, os votos do 1º turno e a reconciliação
        if: steps.preflight.outputs.needs_update == 'true'
        env:
          RESULTS_ZIP: ${{ runner.temp }}/ondevotoagora-resultados/votacao_secao_2026_BR.zip
        run: |
          node ondevotoagora/relatorios/publicar-atualizacao-tse.mjs \
            --capture-dir="$RUNNER_TEMP/ondevotoagora-tse" \
            --results-zip="$RESULTS_ZIP"

      - name: Preparar somente os dados alterados para transferência
        if: steps.preflight.outputs.needs_update == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ondevotoagora-atualizacao/dados"
          cp ondevotoagora/dados/secoes.csv "$RUNNER_TEMP/ondevotoagora-atualizacao/dados/secoes.csv"
          cp ondevotoagora/dados/meta.json "$RUNNER_TEMP/ondevotoagora-atualizacao/dados/meta.json"
          cp ondevotoagora/dados/versoes.json "$RUNNER_TEMP/ondevotoagora-atualizacao/dados/versoes.json"
          cp ondevotoagora/dados/comparacao-lula-flavio-1t.json "$RUNNER_TEMP/ondevotoagora-atualizacao/dados/comparacao-lula-flavio-1t.json"
          cp -R ondevotoagora/dados/versoes "$RUNNER_TEMP/ondevotoagora-atualizacao/dados/versoes"

      - name: Guardar atualização validada para o job de gravação
        if: steps.preflight.outputs.needs_update == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ondevotoagora-dados-validados
          path: ${{ runner.temp }}/ondevotoagora-atualizacao
          if-no-files-found: error
          retention-days: 1

  gravar:
    name: Gravar somente os dados validados
    needs: coletar
    if: needs.coletar.outputs.needs_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Baixar os dados validados
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ondevotoagora-dados-validados
          path: ${{ runner.temp }}/ondevotoagora-atualizacao

      - name: Instalar somente os arquivos de dados esperados
        run: |
          test -s "$RUNNER_TEMP/ondevotoagora-atualizacao/dados/secoes.csv"
          test -s "$RUNNER_TEMP/ondevotoagora-atualizacao/dados/meta.json"
          test -s "$RUNNER_TEMP/ondevotoagora-atualizacao/dados/versoes.json"
          test -s "$RUNNER_TEMP/ondevotoagora-atualizacao/dados/comparacao-lula-flavio-1t.json"
          test -d "$RUNNER_TEMP/ondevotoagora-atualizacao/dados/versoes"
          cp -R "$RUNNER_TEMP/ondevotoagora-atualizacao/dados/." ondevotoagora/dados/

      - name: Commit somente os dados validados e enviar à branch principal
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            ondevotoagora/dados/secoes.csv \
            ondevotoagora/dados/meta.json \
            ondevotoagora/dados/versoes.json \
            ondevotoagora/dados/comparacao-lula-flavio-1t.json \
            ondevotoagora/dados/versoes
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A branch main mudou durante a coleta; não vou enviar dados baseados em uma versão antiga." >&2
            exit 1
          fi
          git commit -m "Atualiza dados eleitorais oficiais do TSE"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publicar-pages:
    needs: gravar
    if: needs.gravar.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.gravar.outputs.commit_sha }}
