name: Publicar OndeVotoAgora no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar somente os arquivos públicos do site
        run: |
          mkdir -p _site/assets _site/dados
          cp ondevotoagora/index.html _site/index.html
          cp ondevotoagora/app.js _site/app.js
          cp ondevotoagora/csv-utils.mjs _site/csv-utils.mjs
          cp ondevotoagora/styles.css _site/styles.css
          cp ondevotoagora/assets/logo-ondevotoagora.png _site/assets/logo-ondevotoagora.png
          cp ondevotoagora/dados/meta.json _site/dados/meta.json
          cp ondevotoagora/dados/secoes.csv _site/dados/secoes.csv
          cp ondevotoagora/CNAME _site/CNAME

      - name: Enviar arquivos para o Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
